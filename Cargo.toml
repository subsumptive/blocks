[workspace]
resolver = "2"
members = [
    "crates/block-lexer",
    "crates/block-parser",
    "crates/block-types",
    "crates/block-ir",
    "crates/block-compiler",
    "crates/block-runtime",
    "crates/sub-cli",
    "crates/block-package",
    "crates/block-resolver",
    "crates/block-registry-core",
    "crates/block-registry-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Subsumptive"]
repository = "https://subsumptive.net"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
semver = { version = "1.0", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
