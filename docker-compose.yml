services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: subsumptive_registry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  registry-api:
    build:
      context: .
      dockerfile: services/registry-api/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/subsumptive_registry
      REGISTRY_BIND_ADDR: 0.0.0.0:8080
      REGISTRY_STORAGE_DIR: /data/archives
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - archivedata:/data/archives

volumes:
  pgdata:
  miniodata:
  archivedata:
