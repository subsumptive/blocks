name: Test Corpsite Dispatch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to subsumptive/corpsite
        env:
          GH_TOKEN: ${{ secrets.CORPSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "error: CORPSITE_DISPATCH_TOKEN secret is missing or empty" >&2
            exit 1
          fi
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/subsumptive/corpsite/dispatches" \
            -d '{"event_type":"blocks-release","client_payload":{"ref":"${{ github.sha }}"}}'
