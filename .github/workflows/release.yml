name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(grep '^version = ' Cargo.toml | head -n1 | cut -d'"' -f2)
          if [ "$TAG" != "$CARGO_VER" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VER"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --bin sub --target ${{ matrix.target }}
      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/sub dist/sub
          tar -czf "sub-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" -C dist sub
      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/sub.exe" "dist/sub.exe"
          Compress-Archive -Path "dist/sub.exe" -DestinationPath "sub-${{ github.ref_name }}-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: sub-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.ext }}

  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify all 5 archives exist and generate SHA256SUMS.txt
        working-directory: artifacts
        run: |
          ls -la
          COUNT=$(ls -1 sub-${GITHUB_REF_NAME}-* | wc -l)
          if [ "$COUNT" -ne 5 ]; then
            echo "Expected 5 release archives, found $COUNT"
            exit 1
          fi
          sha256sum sub-${GITHUB_REF_NAME}-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
      - name: Notify subsumptive/corpsite of release
        if: ${{ secrets.CORPSITE_DISPATCH_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.CORPSITE_DISPATCH_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/subsumptive/corpsite/dispatches" \
            -d '{"event_type":"blocks-release","client_payload":{"ref":"${{ github.ref_name }}"}}'
